<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-S3 Audio Node - Live Stream</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: #0d1117;
  color: #c9d1d9;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 1rem;
}
.card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  max-width: 480px;
  width: 100%;
  padding: 2rem;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}
h1 {
  font-size: 1.25rem;
  font-weight: 600;
  color: #f0f6fc;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(35, 134, 54, 0.2);
  color: #3fb950;
  border: 1px solid #238636;
}
.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3fb950;
  box-shadow: 0 0 8px #3fb950;
}
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.info-box {
  background: #0d1117;
  border: 1px solid #21262d;
  border-radius: 8px;
  padding: 0.75rem;
}
.info-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  color: #8b949e;
  margin-bottom: 2px;
}
.info-value {
  font-size: 0.95rem;
  font-weight: 500;
  color: #e6edf3;
}
canvas {
  width: 100%;
  height: 96px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  margin-bottom: 1.25rem;
}
.player-controls {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
button {
  background: #238636;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  padding: 0.75rem 1.25rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease;
}
button:hover { background: #2ea043; }
button:active { background: #1f772e; }
.btn-stop { background: #da3633; }
.btn-stop:hover { background: #e5534b; }
audio {
  width: 100%;
  margin-top: 0.5rem;
}
.direct-link {
  display: block;
  text-align: center;
  margin-top: 1rem;
  font-size: 0.8rem;
  color: #58a6ff;
  text-decoration: none;
}
.direct-link:hover { text-decoration: underline; }
.gain-override {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 0.75rem;
  background: #0d1117;
  border: 1px solid #21262d;
  border-radius: 8px;
  margin-top: 0.25rem;
}
.gain-override-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.gain-override-header label {
  font-size: 0.85rem;
  color: #c9d1d9;
  cursor: pointer;
  user-select: none;
}
.gain-override input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: #58a6ff;
  cursor: pointer;
  flex-shrink: 0;
}
.gain-slider-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.gain-slider-row input[type="range"] {
  flex: 1;
  accent-color: #58a6ff;
  height: 4px;
  cursor: pointer;
}
.gain-slider-row input[type="range"]:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.gain-label {
  font-size: 0.8rem;
  color: #8b949e;
  min-width: 2.5rem;
  text-align: right;
}
.gain-status {
  font-size: 0.7rem;
  color: #58a6ff;
  min-height: 1em;
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Audio Node</h1>
    <div class="badge"><span class="pulse"></span> LIVE</div>
  </div>
  <div class="info-grid">
    <div class="info-box">
      <div class="info-label">Sample Rate</div>
      <div class="info-value">16,000 Hz</div>
    </div>
    <div class="info-box">
      <div class="info-label">Format</div>
      <div class="info-value">16-bit PCM (Mono)</div>
    </div>
    <div class="info-box">
      <div class="info-label">Microphone</div>
      <div class="info-value">INMP441 (I2S)</div>
    </div>
    <div class="info-box">
      <div class="info-label">Endpoint</div>
      <div class="info-value" id="endpointInfo">:8080/stream.wav</div>
    </div>
  </div>

  <canvas id="viz"></canvas>

  <div class="player-controls">
    <button id="toggleBtn" onclick="togglePlay()">Play Live Stream</button>
    <audio id="audio" controls preload="none" crossorigin="anonymous"></audio>
    <div class="gain-override">
      <div class="gain-override-header">
        <input type="checkbox" id="gainOverrideCheck" onchange="onOverrideToggle()">
        <label for="gainOverrideCheck">Override potentiometer gain</label>
      </div>
      <div class="gain-slider-row">
        <input type="range" id="gainSlider" min="0" max="100" value="50"
               oninput="onSliderInput()" onchange="sendGain()" disabled>
        <span class="gain-label" id="gainPct">50%</span>
      </div>
      <div class="gain-status" id="gainStatus"></div>
    </div>
  </div>
  <a class="direct-link" id="directLink" href="#" target="_blank">Direct Stream Link: :8080/stream.wav</a>
</div>

<script>
const audio = document.getElementById('audio');
const btn = document.getElementById('toggleBtn');
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
let audioCtx = null;
let analyser = null;
let animId = null;

const STREAM_PORT = 8080;
function getStreamUrl() {
  const host = window.location.hostname || '127.0.0.1';
  return window.location.protocol + '//' + host + ':' + STREAM_PORT + '/stream.wav';
}

// Initialize endpoint indicators
const initialStreamUrl = getStreamUrl();
const endpointInfo = document.getElementById('endpointInfo');
const directLink = document.getElementById('directLink');
if (endpointInfo) endpointInfo.textContent = initialStreamUrl;
if (directLink) {
  directLink.href = initialStreamUrl;
  directLink.textContent = 'Direct Stream Link: ' + initialStreamUrl;
}

function setupAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch (e) {
    console.warn("Web Audio API visualizer skipped:", e);
  }
}

function drawVisualizer() {
  animId = requestAnimationFrame(drawVisualizer);
  const width = canvas.width = canvas.offsetWidth;
  const height = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, width, height);

  if (!analyser) {
    // Idle wave animation
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, height / 2);
    ctx.lineTo(width, height / 2);
    ctx.stroke();
    return;
  }

  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);

  const barWidth = (width / dataArray.length) - 2;
  let x = 1;
  for (let i = 0; i < dataArray.length; i++) {
    const barHeight = (dataArray[i] / 255) * (height - 8);
    ctx.fillStyle = '#3fb950';
    ctx.fillRect(x, height - barHeight - 4, barWidth, barHeight);
    x += barWidth + 2;
  }
}

function togglePlay() {
  setupAudioContext();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  if (audio.paused) {
    // Append timestamp to ensure fresh connection to streaming server on port 8080
    audio.src = getStreamUrl() + "?t=" + Date.now();
    audio.play().then(() => {
      btn.textContent = "Pause Stream";
      btn.className = "btn-stop";
      drawVisualizer();
    }).catch(err => {
      console.error("Playback failed:", err);
    });
  } else {
    audio.pause();
    // Detach src to immediately free the streaming connection on the server
    audio.removeAttribute('src');
    audio.load();
    btn.textContent = "Play Live Stream";
    btn.className = "";
    if (animId) cancelAnimationFrame(animId);
  }
}

audio.addEventListener('play', () => {
  btn.textContent = "Pause Stream";
  btn.className = "btn-stop";
  setupAudioContext();
  drawVisualizer();
});

audio.addEventListener('pause', () => {
  btn.textContent = "Play Live Stream";
  btn.className = "";
  if (animId) cancelAnimationFrame(animId);
});

drawVisualizer();

// ── Gain override controls ──────────────────────────────────────────────────
const gainCheck  = document.getElementById('gainOverrideCheck');
const gainSlider = document.getElementById('gainSlider');
const gainPct    = document.getElementById('gainPct');
const gainStatus = document.getElementById('gainStatus');

function onSliderInput() {
  gainPct.textContent = gainSlider.value + '%';
}

function onOverrideToggle() {
  gainSlider.disabled = !gainCheck.checked;
  sendGain();
}

function sendGain() {
  const active  = gainCheck.checked;
  const value   = parseInt(gainSlider.value, 10);
  gainStatus.textContent = 'Sending…';
  fetch(`/gain?override=${active}&value=${value}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ override: active, value })
  })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    gainStatus.textContent = data.gain_override_active
      ? `Override active: ${data.gain_override_percent}%`
      : 'Using physical potentiometer';
  })
  .catch(err => {
    console.error("sendGain failed:", err);
    gainStatus.textContent = 'Error communicating with device';
  });
}

// Sync UI state from the device on page load
fetch('/status')
  .then(r => r.json())
  .then(data => {
    if (data.gain_override_active) {
      gainCheck.checked = true;
      gainSlider.disabled = false;
      gainSlider.value = data.gain_override_percent;
      gainPct.textContent = data.gain_override_percent + '%';
      gainStatus.textContent = `Override active: ${data.gain_override_percent}%`;
    } else {
      gainCheck.checked = false;
      gainSlider.disabled = true;
      if (data.gain_percent !== undefined) {
        gainSlider.value = data.gain_percent;
        gainPct.textContent = data.gain_percent + '%';
        gainStatus.textContent = `Potentiometer: ${data.gain_percent}%`;
      }
    }
  })
  .catch(() => {});
</script>
</body>
</html>
